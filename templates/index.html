<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TikTok Live &amp; Shop Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
<style>
  /* ── reset & base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: #0f0f0f; color: #f0f0f0; min-height: 100vh; }

  /* ── layout ── */
  .page { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }

  /* ── header ── */
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 40px; }
  header .logo { font-size: 28px; }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  header p  { font-size: 13px; color: #888; margin-top: 2px; }

  /* ── upload zone ── */
  .upload-section { background: #1a1a1a; border: 1px solid #2a2a2a;
                    border-radius: 16px; padding: 32px; margin-bottom: 36px; }
  .upload-section h2 { font-size: 15px; font-weight: 600; margin-bottom: 20px; color: #ccc; }

  .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }

  .drop-zone { border: 1.5px dashed #333; border-radius: 12px; padding: 20px 16px;
               text-align: center; cursor: pointer; transition: all 0.2s;
               background: #111; position: relative; }
  .drop-zone:hover, .drop-zone.dragover { border-color: #fe2c55; background: #1e0a0f; }
  .drop-zone.filled { border-color: #25d366; border-style: solid; background: #071a0e; }
  .drop-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .drop-zone .dz-icon { font-size: 26px; margin-bottom: 8px; }
  .drop-zone .dz-label { font-size: 12px; font-weight: 600; color: #bbb; margin-bottom: 4px; }
  .drop-zone .dz-sub   { font-size: 11px; color: #555; }
  .drop-zone .dz-name  { font-size: 11px; color: #25d366; margin-top: 6px;
                          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .run-btn { display: block; width: 100%; margin-top: 22px; padding: 14px;
             background: linear-gradient(135deg, #fe2c55, #ff6b35);
             color: #fff; font-size: 15px; font-weight: 700; border: none;
             border-radius: 12px; cursor: pointer; transition: opacity 0.2s; }
  .run-btn:hover { opacity: 0.88; }
  .run-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .local-btn { display: block; width: 100%; margin-top: 10px; padding: 12px;
               background: #242424; color: #ddd; font-size: 14px; font-weight: 650;
               border: 1px solid #3a3a3a; border-radius: 10px; cursor: pointer;
               transition: background 0.2s; }
  .local-btn:hover { background: #303030; }
  .local-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── status bar ── */
  #status { margin-bottom: 28px; font-size: 13px; color: #888; min-height: 20px; }
  #status.error { color: #ff4d4d; }
  #status.ok    { color: #25d366; }

  /* ── dashboard ── */
  #dashboard { display: none; }

  /* ── toggle ── */
  .toggle-row { display: flex; align-items: center; gap: 8px; margin-bottom: 28px; }
  .toggle-row span { font-size: 13px; color: #888; }
  .toggle { display: flex; background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 8px; overflow: hidden; }
  .toggle button { padding: 7px 18px; font-size: 13px; font-weight: 600; border: none;
                   background: transparent; color: #888; cursor: pointer; transition: all 0.15s; }
  .toggle button.active { background: #fe2c55; color: #fff; }

  /* ── KPI strip ── */
  .kpi-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
               gap: 14px; margin-bottom: 32px; }
  .kpi { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 12px; padding: 18px 16px; }
  .kpi .kpi-label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .kpi .kpi-val   { font-size: 22px; font-weight: 700; color: #f0f0f0; }
  .kpi .kpi-sub   { font-size: 11px; color: #555; margin-top: 4px; }

  /* ── chart cards ── */
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
  @media (max-width: 800px) { .chart-grid { grid-template-columns: 1fr; } }
  .chart-card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 14px; padding: 22px; }
  .chart-card.full { grid-column: 1 / -1; }
  .chart-card h3 { font-size: 13px; font-weight: 600; color: #bbb; margin-bottom: 18px; }
  .chart-wrap { position: relative; }

  /* ── sessions table ── */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { text-align: left; padding: 10px 14px; font-size: 11px; font-weight: 600;
             color: #666; text-transform: uppercase; letter-spacing: 0.4px;
             border-bottom: 1px solid #2a2a2a; }
  tbody tr { border-bottom: 1px solid #1e1e1e; transition: background 0.1s; }
  tbody tr:hover { background: #1e1e1e; }
  tbody td { padding: 11px 14px; color: #ccc; }
  tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px;
           border-radius: 99px; background: #fe2c5520; color: #fe2c55; }
</style>
</head>
<body>
<div class="page">

  <!-- Header -->
  <header>
    <div class="logo">📊</div>
    <div>
      <h1>TikTok Live &amp; Shop Dashboard</h1>
      <p>Upload your exports to visualize live vs. shop performance</p>
    </div>
  </header>

  <!-- Upload -->
  <div class="upload-section">
    <h2>Upload your TikTok exports</h2>
    <div class="file-grid">
      <label class="drop-zone" id="dz-live-product">
        <input type="file" accept=".csv,.xlsx,.xls" data-key="live_product" />
        <div class="dz-icon">🎬</div>
        <div class="dz-label">Live Product</div>
        <div class="dz-sub">CSV or Excel</div>
        <div class="dz-name" id="fn-live_product"></div>
      </label>
      <label class="drop-zone" id="dz-shop-product">
        <input type="file" accept=".csv,.xlsx,.xls" data-key="shop_product" />
        <div class="dz-icon">🛍️</div>
        <div class="dz-label">Shop Product</div>
        <div class="dz-sub">CSV or Excel</div>
        <div class="dz-name" id="fn-shop_product"></div>
      </label>
      <label class="drop-zone" id="dz-live-perf">
        <input type="file" accept=".csv,.xlsx,.xls" data-key="live_performance" />
        <div class="dz-icon">📡</div>
        <div class="dz-label">Live Performance</div>
        <div class="dz-sub">CSV or Excel</div>
        <div class="dz-name" id="fn-live_performance"></div>
      </label>
      <label class="drop-zone" id="dz-shop-daily">
        <input type="file" accept=".csv,.xlsx,.xls" data-key="shop_daily" />
        <div class="dz-icon">📅</div>
        <div class="dz-label">Shop Daily</div>
        <div class="dz-sub">CSV or Excel</div>
        <div class="dz-name" id="fn-shop_daily"></div>
      </label>
    </div>
    <button class="run-btn" id="run-btn" onclick="runUpload()">Generate Dashboard</button>
    <button class="local-btn local-only" id="desktop-btn" onclick="loadDesktopData()">Load SHOPDATA + LIVEDATA</button>
    <button class="local-btn local-only" id="local-btn" onclick="loadInputData()">Load CSVs from input_data/</button>
  </div>

  <div id="status"></div>

  <!-- Dashboard (hidden until data loads) -->
  <div id="dashboard">

    <!-- Week / Month toggle -->
    <div class="toggle-row">
      <span>Group by:</span>
      <div class="toggle">
        <button id="btn-week"  class="active" onclick="setPeriod('week')">Weekly</button>
        <button id="btn-month"                onclick="setPeriod('month')">Monthly</button>
      </div>
    </div>

    <!-- KPIs -->
    <div class="kpi-strip" id="kpi-strip"></div>

    <!-- Charts row 1 -->
    <div class="chart-grid">
      <div class="chart-card full">
        <h3>Live GMV vs Shop Total GMV</h3>
        <div class="chart-wrap"><canvas id="chart-gmv" height="90"></canvas></div>
      </div>
    </div>

    <!-- Charts row 2 -->
    <div class="chart-grid">
      <div class="chart-card full">
        <h3>Live GMV % of Shop Total</h3>
        <div class="chart-wrap"><canvas id="chart-pct" height="95"></canvas></div>
      </div>
      <div class="chart-card full">
        <h3>Top Products — Live vs Shop GMV</h3>
        <div class="chart-wrap"><canvas id="chart-products" height="210"></canvas></div>
      </div>
    </div>

    <!-- Sessions table -->
    <div class="chart-card" style="margin-bottom:40px">
      <h3>Live Session Performance</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Session</th><th>Date</th><th>Duration</th>
              <th style="text-align:right">GMV</th>
              <th style="text-align:right">Orders</th>
              <th style="text-align:right">Views</th>
              <th style="text-align:right">New Followers</th>
            </tr>
          </thead>
          <tbody id="sessions-body"></tbody>
        </table>
      </div>
    </div>
  </div><!-- /dashboard -->

</div><!-- /page -->

<script>
/* ------------------------------------------------------------------ */
/* State                                                                */
/* ------------------------------------------------------------------ */
let _data    = null;
let _period  = "week";
let _charts  = {};

const FILES = ["live_product", "shop_product", "live_performance", "shop_daily"];
const fileMap = {};   // key → File object

if (window.location.protocol === "file:") {
  const status = document.getElementById("status");
  status.className = "error";
  status.textContent = "This page must be opened through the dashboard server, not as a file.";
  document.getElementById("run-btn").disabled = true;
  document.querySelectorAll(".local-only").forEach(el => el.style.display = "none");
} else {
  loadAppConfig();
}

function isLocalHostPage() {
  return ["127.0.0.1", "localhost", "::1"].includes(window.location.hostname);
}

async function loadAppConfig() {
  try {
    const res = await fetch("/app_config");
    const json = await res.json();
    if (!json.ok) return;

    if (!isLocalHostPage() || json.is_public_deploy || !json.has_desktop_data) {
      document.getElementById("desktop-btn").style.display = "none";
    }
    if (!isLocalHostPage() || json.is_public_deploy || !json.has_input_data) {
      document.getElementById("local-btn").style.display = "none";
    }
  } catch (_err) {
    // Leave upload available; server routes will show a precise error if needed.
  }
}

/* ------------------------------------------------------------------ */
/* File-drop wiring                                                     */
/* ------------------------------------------------------------------ */
document.querySelectorAll(".drop-zone input[type=file]").forEach(input => {
  input.addEventListener("change", e => {
    const key  = input.dataset.key;
    const file = input.files[0];
    if (!file) return;
    fileMap[key] = file;
    const lbl = document.getElementById("fn-" + key);
    if (lbl) lbl.textContent = file.name;
    input.closest(".drop-zone").classList.add("filled");
  });
});

// Drag-over highlight
document.querySelectorAll(".drop-zone").forEach(dz => {
  dz.addEventListener("dragover",  e => { e.preventDefault(); dz.classList.add("dragover"); });
  dz.addEventListener("dragleave", ()  => dz.classList.remove("dragover"));
  dz.addEventListener("drop", e => {
    e.preventDefault(); dz.classList.remove("dragover");
    const input = dz.querySelector("input[type=file]");
    if (e.dataTransfer.files.length) {
      input.files = e.dataTransfer.files;
      input.dispatchEvent(new Event("change"));
    }
  });
});

/* ------------------------------------------------------------------ */
/* Upload                                                               */
/* ------------------------------------------------------------------ */
async function runUpload() {
  const btn = document.getElementById("run-btn");
  const status = document.getElementById("status");
  btn.disabled = true;
  status.className = "";
  status.textContent = "Processing…";

  const fd = new FormData();
  for (const key of FILES) {
    if (fileMap[key]) fd.append(key, fileMap[key]);
  }

  try {
    const res  = await fetch("/upload", { method: "POST", body: fd });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "Server error");

    _data = json.data;
    status.className = "ok";
    status.textContent = `Loaded: ${json.data.files_received.join(", ")}`;
    renderDashboard();
  } catch(err) {
    status.className = "error";
    status.textContent = "Error: " + err.message;
  } finally {
    btn.disabled = false;
  }
}

async function loadInputData() {
  const btn = document.getElementById("local-btn");
  const status = document.getElementById("status");
  btn.disabled = true;
  status.className = "";
  status.textContent = "Loading files from input_data/…";

  try {
    const res = await fetch("/load_input_data", { method: "POST" });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "Server error");

    _data = json.data;
    status.className = "ok";
    status.textContent = `Loaded: ${json.data.files_received.join(", ")}`;
    renderDashboard();
  } catch(err) {
    status.className = "error";
    status.textContent = "Error: " + err.message;
  } finally {
    btn.disabled = false;
  }
}

async function loadDesktopData() {
  const btn = document.getElementById("desktop-btn");
  const status = document.getElementById("status");
  btn.disabled = true;
  status.className = "";
  status.textContent = "Loading SHOPDATA + LIVEDATA…";

  try {
    const res = await fetch("/load_desktop_data", { method: "POST" });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "Server error");

    _data = json.data;
    status.className = "ok";
    status.textContent = `Loaded desktop data: ${json.data.files_received.length} files`;
    renderDashboard();
  } catch(err) {
    status.className = "error";
    status.textContent = "Error: " + err.message;
  } finally {
    btn.disabled = false;
  }
}

/* ------------------------------------------------------------------ */
/* Period toggle                                                        */
/* ------------------------------------------------------------------ */
function setPeriod(p) {
  _period = p;
  document.getElementById("btn-week").classList.toggle("active",  p === "week");
  document.getElementById("btn-month").classList.toggle("active", p === "month");
  if (_data) {
    renderKPIs();
    renderCharts();
  }
}

/* ------------------------------------------------------------------ */
/* Dashboard render                                                     */
/* ------------------------------------------------------------------ */
function renderDashboard() {
  document.getElementById("dashboard").style.display = "block";
  renderKPIs();
  renderCharts();
  renderTable();
}

function fmt$(v) {
  if (v == null || isNaN(v)) return "—";
  return "$" + Number(v).toLocaleString("en-US", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}
function fmtN(v) {
  if (v == null || isNaN(v)) return "—";
  return Number(v).toLocaleString("en-US");
}

/* ── KPIs ── */
function renderKPIs() {
  const d  = _data;
  const ot = d.gmv_over_time;
  const period = _period;
  const periodData = ot[period] || {};
  const periodLabel = period === "week" ? "Week" : "Month";
  const periodLabelLower = periodLabel.toLowerCase();

  const labels = periodData.labels || [];
  const shopSeries = periodData.shop_total || [];
  const liveSeries = periodData.live_gmv || [];
  const totalShop  = shopSeries.reduce((a,b) => a+b, 0);
  const totalLive  = liveSeries.reduce((a,b) => a+b, 0);
  const matchedLive = liveSeries.reduce((a,b,idx) => a + (shopSeries[idx] > 0 ? b : 0), 0);
  const periodsWithShop = shopSeries.filter(v => v > 0).length;
  const periodsWithLive = liveSeries.filter(v => v > 0).length;
  const totalViews = d.live_sessions.reduce((a,r) => a + (r.views||0), 0);
  const avgShop = periodsWithShop ? totalShop / periodsWithShop : 0;
  const avgLive = periodsWithLive ? totalLive / periodsWithLive : 0;
  const avgPct = totalShop ? (matchedLive / totalShop * 100).toFixed(1) : "—";

  const kpis = [
    { label: `${periodLabel}s Shown`,       val: labels.length,   sub: `${periodLabelLower} buckets` },
    { label: `Avg Shop / ${periodLabel}`,   val: fmt$(avgShop),   sub: `${periodsWithShop} with shop data` },
    { label: `Avg Live / ${periodLabel}`,   val: fmt$(avgLive),   sub: `${periodsWithLive} with live data` },
    { label: "Live % of Shop",              val: avgPct + "%",    sub: "matched buckets" },
    { label: "Total Live Views",            val: fmtN(totalViews), sub: "all sessions" },
  ];

  document.getElementById("kpi-strip").innerHTML = kpis.map(k =>
    `<div class="kpi">
       <div class="kpi-label">${k.label}</div>
       <div class="kpi-val">${k.val}</div>
       <div class="kpi-sub">${k.sub}</div>
     </div>`
  ).join("");
}

/* ── Charts ── */
function destroyChart(id) {
  if (_charts[id]) { _charts[id].destroy(); delete _charts[id]; }
}

const COLORS = {
  shopTotal:  "rgba(99,102,241,0.75)",
  shopLive:   "rgba(254,44,85,0.75)",
  liveGMV:    "rgba(255,107,53,0.85)",
  liveGMV2:   "rgba(254,44,85,0.85)",
  shopGMV:    "rgba(99,102,241,0.75)",
  pct:        "rgba(34,197,94,1)",
  pctFill:    "rgba(34,197,94,0.12)",
};

const baseOpts = {
  responsive: true,
  plugins: { legend: { labels: { color: "#aaa", font: { size: 12 } } } },
  scales: {
    x: { ticks: { color: "#666", maxRotation: 45 }, grid: { color: "#1e1e1e" } },
    y: { ticks: { color: "#666" }, grid: { color: "#1e1e1e" } }
  }
};

function renderCharts() {
  const p  = _period;
  const ot = (_data.gmv_over_time || {})[p] || {};
  const pc = (_data.live_pct       || {})[p] || {};
  const pr = _data.top_products || {};

  // Chart 1 — GMV over time (grouped bar)
  destroyChart("gmv");
  _charts["gmv"] = new Chart(document.getElementById("chart-gmv"), {
    type: "bar",
    data: {
      labels: ot.labels || [],
      datasets: [
        { label: "Shop Total GMV",         data: ot.shop_total    || [], backgroundColor: COLORS.shopTotal },
        { label: "Shop Live-Attributed GMV",data: ot.shop_live_attr|| [], backgroundColor: COLORS.shopLive  },
        { label: "Live Session GMV",        data: ot.live_gmv      || [], backgroundColor: COLORS.liveGMV   },
      ]
    },
    options: { ...baseOpts,
      scales: { ...baseOpts.scales,
        y: { ...baseOpts.scales.y, ticks: { ...baseOpts.scales.y.ticks,
          callback: v => "$" + (v >= 1000 ? (v/1000).toFixed(1)+"k" : v) }}}}
  });

  // Chart 2 — Live % line
  destroyChart("pct");
  _charts["pct"] = new Chart(document.getElementById("chart-pct"), {
    type: "line",
    data: {
      labels: pc.labels || [],
      datasets: [{
        label: "Live GMV % of Shop Total",
        data: pc.pct || [],
        borderColor: COLORS.pct,
        backgroundColor: COLORS.pctFill,
        fill: true, tension: 0.35, pointRadius: 4,
        pointBackgroundColor: COLORS.pct,
      }]
    },
    options: { ...baseOpts,
      scales: { ...baseOpts.scales,
        y: { ...baseOpts.scales.y, ticks: { ...baseOpts.scales.y.ticks,
          callback: v => v + "%" }}}}
  });

  // Chart 3 — Top products horizontal bar
  destroyChart("products");
  _charts["products"] = new Chart(document.getElementById("chart-products"), {
    type: "bar",
    data: {
      labels: pr.labels || [],
      datasets: [
        { label: "Live GMV",       data: pr.live_gmv || [], backgroundColor: COLORS.liveGMV2 },
        { label: "Shop Total GMV", data: pr.shop_gmv || [], backgroundColor: COLORS.shopGMV  },
      ]
    },
    options: { ...baseOpts,
      indexAxis: "y",
      scales: { ...baseOpts.scales,
        x: { ...baseOpts.scales.x, ticks: { ...baseOpts.scales.x.ticks,
          callback: v => "$" + (v >= 1000 ? (v/1000).toFixed(1)+"k" : v) }},
        y: { ticks: { color: "#888", font: { size: 11 } }, grid: { color: "#1e1e1e" } }}}
  });
}

/* ── Sessions table ── */
function renderTable() {
  const rows = _data.live_sessions || [];
  document.getElementById("sessions-body").innerHTML = rows.map(r =>
    `<tr>
       <td><span class="badge">LIVE</span> ${r.name}</td>
       <td>${r.date}</td>
       <td>${r.duration}</td>
       <td class="num">${fmt$(r.gmv)}</td>
       <td class="num">${fmtN(r.orders)}</td>
       <td class="num">${fmtN(r.views)}</td>
       <td class="num">${fmtN(r.followers)}</td>
     </tr>`
  ).join("");
}
</script>
</body>
</html>
